<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Detection History - Potato Detection</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .history-container {
        max-width: 1000px;
        margin: 20px auto;
        padding: 20px;
      }
      
      .stats-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }
      
      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        border-radius: 10px;
        color: white;
        text-align: center;
      }
      
      .stat-card.fresh {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }
      
      .stat-card.rotten {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      }
      
      .stat-card h3 {
        margin: 0 0 10px 0;
        font-size: 14px;
        opacity: 0.9;
      }
      
      .stat-card .number {
        font-size: 36px;
        font-weight: bold;
      }
      
      .history-table {
        background: #2d2d2d;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      
      table {
        width: 100%;
        border-collapse: collapse;
        color: white;
      }
      
      th {
        background: #1e1e1e;
        padding: 15px;
        text-align: left;
        border-bottom: 2px solid #4CAF50;
      }
      
      td {
        padding: 12px 15px;
        border-bottom: 1px solid #444;
      }
      
      tr:hover {
        background: #383838;
      }
      
      .badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }
      
      .badge.fresh {
        background: #4CAF50;
        color: white;
      }
      
      .badge.rotten {
        background: #f44336;
        color: white;
      }
      
      .controls {
        text-align: center;
        margin-bottom: 20px;
      }
      
      .btn-clear {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }
      
      .btn-clear:hover {
        background: #d63031;
      }
      
      .btn-back {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 20px;
        background: #008CBA;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }
      
      .btn-back:hover {
        background: #007399;
      }
      
      .empty-state {
        text-align: center;
        padding: 40px;
        color: #888;
      }
    </style>
  </head>

  <body>
    <div class="history-container">
      <a href="/" class="btn-back">← Back to Home</a>
      
      <h1>📊 Detection History</h1>

      <div class="stats-cards">
        <div class="stat-card">
          <h3>Total Detections</h3>
          <div class="number" id="total-detections">0</div>
        </div>
        <div class="stat-card fresh">
          <h3>Total Fresh 🟢</h3>
          <div class="number" id="total-fresh">0</div>
        </div>
        <div class="stat-card rotten">
          <h3>Total Rotten 🔴</h3>
          <div class="number" id="total-rotten">0</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-clear" onclick="clearHistory()">🗑️ Clear History</button>
      </div>

      <div class="history-table">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>Type</th>
              <th>Position</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr>
              <td colspan="4" style="text-align: center; padding: 20px;">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      async function loadHistory() {
        try {
          const response = await fetch('/api/history');
          const data = await response.json();

          // Update stats
          document.getElementById('total-detections').textContent = data.total_detections;
          document.getElementById('total-fresh').textContent = data.fresh_count;
          document.getElementById('total-rotten').textContent = data.rotten_count;

          // Load history
          const tbody = document.getElementById('history-tbody');
          if (data.history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No detections yet</td></tr>';
            return;
          }

          tbody.innerHTML = data.history.map((item, idx) => `
            <tr>
              <td>${data.total_detections - idx}</td>
              <td>${new Date(item.timestamp).toLocaleString()}</td>
              <td><span class="badge ${item.class.toLowerCase()}">${item.class.toUpperCase()}</span></td>
              <td>X: ${item.position.x}, Y: ${item.position.y}</td>
            </tr>
          `).join('');
        } catch (error) {
          console.error('Error:', error);
          document.getElementById('history-tbody').innerHTML = 
            '<tr><td colspan="4" style="color: red;">Error loading history</td></tr>';
        }
      }

      async function clearHistory() {
        if (confirm('Are you sure you want to clear all history? This cannot be undone.')) {
          const response = await fetch('/api/history/clear');
          const result = await response.json();
          if (result.status === 'ok') {
            alert('History cleared!');
            loadHistory();
          }
        }
      }

      // Load on page load
      loadHistory();
      
      // Refresh every 1 second
      setInterval(loadHistory, 1000);
    </script>
  </body>
</html>
